<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8JNR2C0JMX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8JNR2C0JMX');

  <title>Contact Rocinante Marketing | Contractor Web Design</title>
  <meta name="description" content="Contact Rocinante Marketing to ask questions, schedule a call, or request a quote for contractor web design services. Fast, reliable websites built to generate calls for home service businesses.">
  <meta name="keywords" content="contact contractor web designer, web design consultation, home service web design contact, HVAC website designer contact, plumbing website design consultation, small business web design contact.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="nav.css">
  <link rel="stylesheet" href="contact.css">
  <script defer src="includes.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div data-include="nav"></div>

  <main id="main">
    <section class="contact-hero">
      <div class="container contact-hero__inner">
        <div class="contact-hero__copy">
          <h1>Contact</h1>
        </div>
      </div>
    </section>

    <section id="contact" class="section contact-section" aria-labelledby="contact-intro">
      <div class="container contact-grid">
        <div class="contact-copy work__intro">
          <p class="eyebrow">Say Hey</p>
          <h2 id="contact-intro">Ready for a Better Local Presence?</h2>
          <div class="work-divider" aria-hidden="true"></div>
          <p class="body">Ask questions, schedule a call, or request a quote. Your website should do more than exist — it should bring you business.</p>
          <a class="btn primary" href="https://calendly.com/jj-rocinantemarketing/30min" target="_blank" rel="noopener">Schedule a Call</a>
        </div>

        <form class="contact-form" id="contact-form" method="POST" name="contact" data-netlify="true">
          <div class="form-grid">
            <div>
              <label for="first-name">First name</label>
              <input type="text" id="first-name" name="first-name" placeholder="Jane" required>
            </div>
            <div>
              <label for="last-name">Last name</label>
              <input type="text" id="last-name" name="last-name" placeholder="Doe" required>
            </div>
          </div>

          <div class="form-grid">
            <div>
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div>
              <label for="phone">Phone number</label>
              <input type="tel" id="phone" name="phone" placeholder="(555) 123-4567">
            </div>
          </div>

          <div class="form-grid">
            <div>
              <label for="company">Company name</label>
              <input type="text" id="company" name="company" placeholder="Your company">
            </div>
            <div>
              <label for="website">Website URL</label>
              <input type="url" id="website" name="website" placeholder="https://yourdomain.com">
            </div>
          </div>

          <div class="form-grid">
            <div class="full-width">
              <label for="message">Message</label>
              <textarea id="message" name="message" placeholder="Tell us about your project, goals, or timeline." required></textarea>
            </div>
          </div>

          <!-- <label class="form-optin">
            <input id="sms-opt-in" type="checkbox" name="opt-in" value="yes">
            <span>I agree to receive text messages from Rocinante Marketing, LLC related to my inquiry and appointments. Message frequency varies. Message and data rates may apply.</span>
          </label> -->
          <div>
            <button class="btn primary" type="submit">Submit</button>
          </div>
          <!-- <p class="form-footer">Reply STOP to unsubscribe or HELP for assistance. View our <a href="privacy.html">Privacy Policy</a>.</p> -->
        </form>
      </div>
    </section>
  </main>

    <div data-include="footer"></div>

  <div class="mobile-cta-bar">
    <a class="btn primary" href="#contact">Request Service</a>
    <a class="btn secondary" href="tel:+15551234567">Call Now</a>
  </div>

  <script>
    (() => {
      const form = document.getElementById('contact-form');
      const phone = document.getElementById('phone');
      const optIn = document.getElementById('sms-opt-in');

      if (!form || !phone || !optIn) return;

      const clearValidity = () => optIn.setCustomValidity('');
      optIn.addEventListener('change', clearValidity);

      form.addEventListener('submit', (e) => {
        const phoneFilled = phone.value.trim().length > 0;
        if (phoneFilled) {
          optIn.required = true;
          if (!optIn.checked) {
            optIn.setCustomValidity('Please consent to receive texts if you would like SMS updates.');
            optIn.reportValidity();
            e.preventDefault();
            return;
          }
        } else {
          optIn.required = false;
          clearValidity();
        }
      });
    })();
  </script>
</body>
</html>
